<!-- Hand-written approximation of WhatsApp Web markup (1:1 chat). Refresh from a live page when selectors break. -->
<div id="app"><div id="main">
  <header><div data-testid="conversation-info-header"><span dir="auto" title="Family">Family</span><div><span>You, Alice, Bob</span></div></div></header>
  <div data-testid="conversation-panel-messages" role="application">
    <div role="row"><div data-id="MSG0001" class="message-in">
      <div class="copyable-text" data-pre-plain-text="[10:00, 1/1/2026] Alice: ">
        <span class="selectable-text copyable-text" dir="ltr"><span>just a normal message</span></span>
      </div></div></div>
    <div role="row"><div data-id="MSG0002" class="message-in">
      <div class="copyable-text" data-pre-plain-text="[10:01, 1/1/2026] Alice: ">
        <span class="selectable-text copyable-text" dir="ltr"><span>__CIPHER_1__</span></span>
      </div></div></div>
    <div role="row"><div data-id="MSG0003" class="message-out">
      <div class="copyable-text" data-pre-plain-text="[10:02, 1/1/2026] Me: ">
        <span class="selectable-text copyable-text" dir="ltr"><span>__CIPHER_2__</span></span>
      </div></div></div>
  </div>
  <footer>
    <div contenteditable="true" data-tab="10" role="textbox" aria-label="Type a message"><p class="selectable-text copyable-text"><br></p></div>
    <button aria-label="Send"><span data-icon="send"></span></button>
  </footer>
</div></div>
