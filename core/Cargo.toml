[package]
name = "core"
version = "0.1.0"
edition = "2021"
description = "CipherChat core: authenticated text encryption with a versioned wire format"
license = "MIT"

[lib]
name = "cipherchat_core"

[dependencies]
chacha20poly1305 = "0.10"
argon2 = "0.5"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
