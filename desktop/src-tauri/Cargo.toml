[package]
name = "desktop"
version = "0.1.0"
edition = "2021"
description = "CipherChat desktop app: paste-in/copy-out encryption with a local key vault"

[lib]
name = "cipherchat_desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cipherchat_core = { package = "core", path = "../../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
arboard = { version = "3", default-features = false }
zeroize = { version = "1", features = ["derive", "serde"] }

[dev-dependencies]
base64 = "0.22"
tempfile = "3"

[features]
# Set by `tauri build`: serve the bundled frontend instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]
